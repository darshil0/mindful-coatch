name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Run this before setup-node so a missing lockfile produces
      # an actionable error instead of an npm cache setup failure.
      - name: Verify npm project files
        shell: bash
        run: |
          if [[ ! -f package.json ]]; then
            echo "::error::package.json is missing from the repository root."
            exit 1
          fi

          if [[ ! -f package-lock.json ]]; then
            echo "::error::package-lock.json is missing. Generate and commit it before using this npm workflow."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Show runtime versions
        run: |
          node --version
          npm --version

      - name: Validate required scripts
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const { scripts = {} } = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const required = [
            "format:check",
            "lint",
            "typecheck",
            "test",
            "build",
          ];

          const missing = required.filter(
            (name) =>
              typeof scripts[name] !== "string" ||
              scripts[name].trim().length === 0
          );

          if (missing.length > 0) {
            console.error(
              "::error::Missing package.json scripts: " +
                missing.join(", ")
            );
            process.exit(1);
          }
          NODE

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build production application
        run: npm run build
